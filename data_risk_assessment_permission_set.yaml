# Generated by tools/build_permission_set_template.py from data_risk_assessment_role.yaml. Do not edit by hand: change the role template and rebuild.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::LanguageExtensions

Description: >
  Cloud Data Protection Review - read-only IAM Identity Center permission set, for organizations that do not allow
  sts:AssumeRole. Deploy it where IAM Identity Center is administered (the management account, or its delegated
  administrator), in IAM Identity Center's Region. It creates one permission set holding the same read-only policy as
  data_risk_assessment_role.yaml (metadata only, with the same explicit Deny block) and assigns it to one reviewer in the
  accounts listed. IAM Identity Center creates the matching role in each of those accounts. The collector then reads each
  account with it through the access portal (python3 collector.py --sso-profile ...). Delete the stack to remove every
  assignment and the permission set.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - InstanceArn
          - PrincipalId
          - AccountIds
      - Label:
          default: Optional
        Parameters:
          - PrincipalType
          - PermissionSetName
          - SessionDuration
    ParameterLabels:
      InstanceArn:
        default: IAM Identity Center instance
      PrincipalId:
        default: Who runs the review (user or group ID in IAM Identity Center)
      AccountIds:
        default: Accounts to assess

Parameters:
  InstanceArn:
    Type: String
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn|aws-iso|aws-iso-b):sso:::instance/(sso)?ins-[a-zA-Z0-9-.]{16}$"
    Description: >
      The IAM Identity Center instance. Find it with:
      aws sso-admin list-instances --query 'Instances[0].InstanceArn' --output text

  PrincipalId:
    Type: String
    AllowedPattern: "^([0-9a-f]{10}-|)[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$"
    Description: >
      The IAM Identity Center user (or group, with PrincipalType GROUP) who runs the review. Only this principal gets the
      permission set. Find a user's ID with: aws identitystore get-user-id --identity-store-id ID
      --alternate-identifier "UniqueAttribute={AttributePath=userName,AttributeValue=NAME}"

  PrincipalType:
    Type: String
    Default: USER
    AllowedValues: ["USER", "GROUP"]
    Description: USER for one person, GROUP for a group of reviewers.

  AccountIds:
    Type: CommaDelimitedList
    Description: >
      The 12-digit IDs of the accounts to assess, separated by commas. Up to about 490 accounts in one stack (CloudFormation's
      limit of 500 resources). The management account can be left out: assigning a permission set there needs IAM rights in
      that account, and the report lists any account without the permission set as not assessed.

  PermissionSetName:
    Type: String
    Default: DataProtectionReviewer
    AllowedPattern: "^[A-Za-z0-9+=,.@-]{1,32}$"
    Description: The permission set's name. The collector asks for it by name (--sso-permission-set; this is its default).

  SessionDuration:
    Type: String
    Default: PT4H
    AllowedPattern: "^PT([1-9]|1[0-2])H$"
    Description: >
      How long the credentials it hands out last (PT1H to PT12H). The collector asks the portal for new ones before they
      expire, for as long as the reviewer's sign-in is valid.

Resources:
  ReviewerPermissionSet:
    Type: AWS::SSO::PermissionSet
    Properties:
      InstanceArn: !Ref InstanceArn
      Name: !Ref PermissionSetName
      Description: Cloud Data Protection Review - read-only, metadata only, explicit Deny on data and every write.
      SessionDuration: !Ref SessionDuration
      InlinePolicy:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "ResourceDiscovery",
              "Effect": "Allow",
              "Action": [
                "tag:GetResources",
                "resource-explorer-2:Search",
                "resource-explorer-2:ListIndexes",
                "config:SelectResourceConfig",
                "config:SelectAggregateResourceConfig",
                "config:DescribeConfigurationAggregators",
                "config:DescribeConfigurationRecorders",
                "config:DescribeConfigurationRecorderStatus"
              ],
              "Resource": "*"
            },
            {
              "Sid": "PerServiceInventory",
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeRegions",
                "ec2:DescribeVolumes",
                "ec2:DescribeSnapshots",
                "rds:DescribeDBInstances",
                "rds:DescribeDBClusters",
                "rds:DescribeDBSnapshots",
                "rds:DescribeDBClusterSnapshots",
                "dynamodb:ListTables",
                "dynamodb:DescribeTable",
                "dynamodb:ListTagsOfResource",
                "s3:ListAllMyBuckets",
                "s3:GetBucketLocation",
                "s3:GetBucketTagging"
              ],
              "Resource": "*"
            },
            {
              "Sid": "NativeProtectionState",
              "Effect": "Allow",
              "Action": [
                "dynamodb:DescribeContinuousBackups",
                "dynamodb:ListBackups",
                "rds:DescribeDBSnapshotAttributes",
                "rds:DescribeDBClusterSnapshotAttributes",
                "rds:DescribeDBInstanceAutomatedBackups",
                "rds:DescribeDBClusterAutomatedBackups",
                "ec2:DescribeImages",
                "s3:GetBucketObjectLockConfiguration",
                "s3:GetBucketNotification",
                "dlm:GetLifecyclePolicies",
                "dlm:GetLifecyclePolicy",
                "s3:GetBucketVersioning",
                "s3:GetLifecycleConfiguration",
                "s3:GetReplicationConfiguration"
              ],
              "Resource": "*"
            },
            {
              "Sid": "BackupConfiguration",
              "Effect": "Allow",
              "Action": [
                "backup:ListBackupPlans",
                "backup:GetBackupPlan",
                "backup:ListBackupSelections",
                "backup:GetBackupSelection",
                "backup:ListBackupVaults",
                "backup:DescribeRegionSettings",
                "backup:DescribeBackupVault",
                "backup:ListProtectedResources",
                "backup:ListRecoveryPointsByBackupVault",
                "backup:ListBackupJobs",
                "backup:ListCopyJobs",
                "backup:ListRestoreJobs",
                "backup:ListRestoreTestingPlans",
                "backup:GetRestoreTestingPlan",
                "backup:ListRestoreTestingSelections",
                "backup:GetRestoreTestingSelection",
                "backup:GetBackupVaultNotifications",
                "backup:GetBackupVaultAccessPolicy",
                "backup:ListFrameworks",
                "backup:DescribeFramework",
                "backup:ListReportPlans",
                "backup:ListLegalHolds",
                "backup:ListRecoveryPointsByLegalHold"
              ],
              "Resource": "*"
            },
            {
              "Sid": "BackupKeyState",
              "Effect": "Allow",
              "Action": [
                "kms:DescribeKey"
              ],
              "Resource": "*"
            },
            {
              "Sid": "VerifyAirGappedVaultSharing",
              "Effect": "Allow",
              "Action": [
                "ram:GetResourceShares"
              ],
              "Resource": "*"
            },
            {
              "Sid": "MultiPartyApprovalState",
              "Effect": "Allow",
              "Action": [
                "mpa:ListApprovalTeams"
              ],
              "Resource": "*"
            },
            {
              "Sid": "ApplicationGrouping",
              "Effect": "Allow",
              "Action": [
                "servicecatalog:ListApplications",
                "servicecatalog:ListAssociatedResources",
                "cloudformation:ListStacks",
                "cloudformation:ListStackResources",
                "ecs:ListClusters",
                "ecs:ListServices",
                "eks:ListClusters"
              ],
              "Resource": "*"
            },
            {
              "Sid": "CriticalityAndMonitoring",
              "Effect": "Allow",
              "Action": [
                "cloudwatch:GetMetricData",
                "cloudwatch:GetMetricStatistics",
                "cloudwatch:ListMetrics",
                "cloudwatch:DescribeAlarms",
                "events:ListRules"
              ],
              "Resource": "*"
            },
            {
              "Sid": "AnalyticsTableFormats",
              "Effect": "Allow",
              "Action": [
                "glue:GetDatabases",
                "glue:GetTables",
                "s3tables:ListTableBuckets",
                "s3tables:ListTables"
              ],
              "Resource": "*"
            },
            {
              "Sid": "NeverReadCustomerData",
              "Effect": "Deny",
              "Action": [
                "s3:GetObject*",
                "dynamodb:GetItem",
                "dynamodb:BatchGet*",
                "dynamodb:Query",
                "dynamodb:Scan",
                "dynamodb:PartiQL*",
                "dynamodb:Export*",
                "dynamodb:GetRecords",
                "dynamodb:GetShardIterator",
                "rds:Download*",
                "rds-data:*",
                "ebs:*",
                "ec2:GetPasswordData",
                "ec2:GetConsoleOutput",
                "ec2:GetConsoleScreenshot",
                "kms:Decrypt",
                "kms:Encrypt",
                "kms:ReEncrypt*",
                "kms:GenerateDataKey*",
                "kms:GenerateMac",
                "kms:GenerateRandom",
                "kms:VerifyMac",
                "kms:Sign",
                "kms:Verify",
                "kms:DeriveSharedSecret",
                "kms:GetKeyPolicy",
                "kms:GetPublicKey",
                "kms:GetParametersForImport",
                "kms:ListGrants",
                "kms:ListRetirableGrants",
                "secretsmanager:*",
                "ssm:*",
                "logs:*",
                "athena:*",
                "lambda:*"
              ],
              "Resource": "*"
            },
            {
              "Sid": "NeverMutateAnything",
              "Effect": "Deny",
              "Action": [
                "backup:Delete*",
                "backup:Update*",
                "backup:Put*",
                "backup:Create*",
                "backup:Start*",
                "backup:Stop*",
                "backup:Disassociate*",
                "backup-storage:*",
                "s3:Put*",
                "s3:Delete*",
                "s3:Create*",
                "s3:Restore*",
                "s3:Replicate*",
                "s3:Bypass*",
                "dynamodb:Put*",
                "dynamodb:Update*",
                "dynamodb:Delete*",
                "dynamodb:Create*",
                "dynamodb:Restore*",
                "dynamodb:Import*",
                "dynamodb:BatchWrite*",
                "rds:Delete*",
                "rds:Modify*",
                "rds:Create*",
                "rds:Restore*",
                "rds:Reboot*",
                "rds:Stop*",
                "rds:Start*",
                "rds:Copy*",
                "ec2:Delete*",
                "ec2:Create*",
                "ec2:Modify*",
                "ec2:Terminate*",
                "ec2:Stop*",
                "ec2:Start*",
                "ec2:Reboot*",
                "ec2:Copy*",
                "dlm:Create*",
                "dlm:Update*",
                "dlm:Delete*",
                "kms:Create*",
                "kms:Delete*",
                "kms:Disable*",
                "kms:Schedule*",
                "kms:Revoke*",
                "kms:Put*",
                "kms:Update*",
                "kms:Enable*",
                "kms:Cancel*",
                "kms:Tag*",
                "kms:Untag*",
                "kms:Import*",
                "kms:Replicate*",
                "kms:Retire*",
                "iam:*",
                "organizations:Create*",
                "organizations:Delete*",
                "organizations:Update*",
                "organizations:Attach*",
                "organizations:Detach*",
                "organizations:Leave*",
                "organizations:Remove*",
                "cloudformation:Create*",
                "cloudformation:Delete*",
                "cloudformation:Update*",
                "cloudformation:Execute*",
                "ram:Create*",
                "ram:Delete*",
                "ram:Update*",
                "ram:Associate*",
                "ram:Disassociate*",
                "mpa:Create*",
                "mpa:Update*",
                "mpa:Delete*",
                "mpa:Start*",
                "mpa:Cancel*",
                "glue:Create*",
                "glue:Update*",
                "glue:Delete*",
                "s3tables:Create*",
                "s3tables:Update*",
                "s3tables:Delete*",
                "s3tables:Put*",
                "cloudwatch:Put*",
                "cloudwatch:Delete*",
                "cloudwatch:Set*",
                "config:Put*",
                "config:Delete*",
                "config:Start*",
                "config:Stop*",
                "events:Put*",
                "events:Delete*",
                "events:Create*",
                "events:Remove*",
                "events:Disable*",
                "events:Enable*",
                "resource-explorer-2:Create*",
                "resource-explorer-2:Delete*",
                "resource-explorer-2:Update*",
                "ebs:GetSnapshotBlock",
                "elasticfilesystem:Create*",
                "elasticfilesystem:Delete*",
                "elasticfilesystem:Modify*",
                "elasticfilesystem:Put*",
                "fsx:Create*",
                "fsx:Delete*",
                "fsx:Update*",
                "fsx:Restore*"
              ],
              "Resource": "*"
            }
          ]
        }

  Fn::ForEach::ReviewerAssignments:
    - AccountId
    - !Ref AccountIds
    - Assignment${AccountId}:
        Type: AWS::SSO::Assignment
        Properties:
          InstanceArn: !Ref InstanceArn
          PermissionSetArn: !GetAtt ReviewerPermissionSet.PermissionSetArn
          PrincipalId: !Ref PrincipalId
          PrincipalType: !Ref PrincipalType
          TargetId: !Ref AccountId
          TargetType: AWS_ACCOUNT

Outputs:
  PermissionSetArn:
    Description: The reviewer permission set.
    Value: !GetAtt ReviewerPermissionSet.PermissionSetArn
  PermissionSetName:
    Description: Pass this to the collector as --sso-permission-set if it is not the default.
    Value: !Ref PermissionSetName
  NextStep:
    Description: What the reviewer runs, with an AWS CLI profile for IAM Identity Center (aws configure sso --profile dpr).
    Value: aws sso login --profile dpr && python3 collector.py --sso-profile dpr
